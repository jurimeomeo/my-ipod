<!DOCTYPE HTML>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
<title>Aang Blog Widget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cabin&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: linear-gradient(0deg, #dcd3f2 0%, #FFFFFF 86%);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Cabin', sans-serif;
  }
  
  #main {
    background-color: #FFFFFF;
    border-radius: 8px;
    border: 2px solid #c6beda;
    padding: 12px;
    width: 290px;
    text-align: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
  }

  h1 {
    font-size: 20px;
    color: #b0a9c2;
    margin-bottom: 10px;
    letter-spacing: 2px;
    font-weight: normal;
  }

  .grid-container {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
  }

  /* Khung 2 cột có hiệu ứng ẩn/hiện */
  .card {
    border: 2px double #b0a9c2;
    border-radius: 6px;
    height: 120px;
    width: 125px;
    position: relative;
    overflow: hidden;
    cursor: pointer;
  }

  /* Lớp phủ ảnh bên trên */
  .card .cover-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    position: absolute;
    top: 0;
    left: 0;
    z-index: 2;
    transition: transform 0.6s ease, opacity 0.6s ease;
  }

  /* Di chuột hoặc chạm vào ảnh sẽ trượt lên lộ nội dung */
  .card:hover .cover-img, .card:active .cover-img {
    transform: translateY(-100%);
    opacity: 0;
  }

  /* Nội dung chữ phía dưới */
  .card .content {
    height: 100%;
    width: 100%;
    padding: 6px;
    font-size: 9px;
    color: #b0a9c2;
    overflow-y: auto;
    background: radial-gradient(circle, #dcd3f2 9%, #FFFFFF 100%);
    text-align: center;
    line-height: 1.3;
    z-index: 1;
  }

  mark {
    background: linear-gradient(0deg, rgba(220, 211, 242, 1) 0%, rgba(176, 169, 194, 1) 100%);
    border: 1px solid #b0a9c2;
    border-radius: 4px;
    color: #fff;
    padding: 1px 6px;
    font-size: 8px;
    display: inline-block;
    margin: 2px 0;
  }

  /* Thanh status + nhạc */
  .status-bar {
    background-color: #eee9f9;
    border-radius: 12px;
    padding: 4px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 10px;
    color: #b0a9c2;
  }

  .status-bar img {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 1px solid #c6beda;
  }

  .player-controls {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 6px;
    padding: 0 4px;
  }

  audio {
    width: 100%;
    height: 20px;
    filter: sepia(20%) saturate(70%) hue-rotate(240deg);
  }
</style>
</head>
<body>

<div id="main">
  <h1>AANG ♡ BLOG</h1>

  <div class="grid-container">
    <!-- Cột trái: About -->
    <div class="card">
      <img class="cover-img" src="https://dl.dropbox.com/s/jqtwmbjo6apxlg8/tumblr_f7dc60db56991b5f4a8a589f972748c4_81922cd4_1280.jpg?dl=0" alt="Cover 1">
      <div class="content">
        <mark>About</mark><br>
        keyla she/her mexa hetero 18 piscis isfj<br><br>
        <span style="color: #b0a9c2;">❥</span> naruto, naruhina, hinata, sasunaru, aang, ver dramas, gatos, btsidle<br><br>
        <mark>anime</mark><br>
        naruto/shippuden boruto snk sk8
      </div>
    </div>

    <!-- Cột phải: Chi tiết thêm -->
    <div class="card">
      <img class="cover-img" src="https://64.media.tumblr.com/6ed4f1aa849e31210e45b5007784a5af/71c3e4456f2ea96b-38/s2048x3072/f101bd7373490948b0109b338d1c41225ca43b9f.jpg" alt="Cover 2">
      <div class="content">
        <mark>musiquita</mark><br>
        bts g idle jennie ryujin chaewon<br><br>
        <mark>actores</mark><br>
        bright vachirawit kim bum lee jieun ahn hyoseop
      </div>
    </div>
  </div>

  <!-- Thanh Status -->
  <div class="status-bar">
    <span>saskegt status • online</span>
    <img src="https://64.media.tumblr.com/6ed4f1aa849e31210e45b5007784a5af/71c3e4456f2ea96b-38/s2048x3072/f101bd7373490948b0109b338d1c41225ca43b9f.jpg" alt="avatar">
  </div>

  <!-- Thanh phát nhạc -->
  <div class="player-controls">
    <audio controls>
      <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>
  </div>
</div>

</body>
</html>
